name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, pruebas unitarias y e2e
    # Fijo en 24.04: «ubuntu-latest» pasó a 26.04 y Playwright 1.56 no instala Chromium ahí («does not support chromium on ubuntu26.04»).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Instalar Chromium para las pruebas de navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas e2e (app compilada + anillo simulado)
        run: npm run e2e
      - name: Conservar trazas si fallan las pruebas e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trazas
          path: tests/e2e/.artifacts
          retention-days: 7
